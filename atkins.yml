tasks:
  default:
    passthru: true
    cmds:
      - go fmt ./...
      - go test -bench=. -benchtime=10s -count 1 -cover -coverpkg github.com/titpetric/pdo/... -coverprofile pkg.cov ./...
      - go tool cover -func=pkg.cov | summary coverfunc --packages

  setup: go install github.com/titpetric/exp/cmd/summary@latest